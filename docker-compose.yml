services:
  # ------------------------------------------
  # MongoDB Database Service
  # ------------------------------------------
  mongo:
    image: mongo:7.0
    container_name: foodrush_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - foodrush-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand({ ping: 1 })' --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ------------------------------------------
  # Node.js + Express + Socket.io Backend Service
  # ------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodrush_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=http://localhost:3000
      - MONGO_URI=mongodb://mongo:27017/food_delivery_db
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_change_in_production_12345!}
      - JWT_EXPIRES_IN=7d
      - BASE_DELIVERY_FEE=30
      - PER_KM_DELIVERY_FEE=10
      - FREE_DELIVERY_THRESHOLD=500
      - TAX_RATE_PERCENTAGE=5
      - PLATFORM_FEE=5
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - foodrush-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ------------------------------------------
  # React + Redux Toolkit + Nginx Frontend Service
  # ------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api/v1
        - VITE_SOCKET_URL=/
    container_name: foodrush_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - foodrush-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mongo_data:
    driver: local

networks:
  foodrush-network:
    driver: bridge
